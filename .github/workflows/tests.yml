name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Production runs Postgres; locally the suite runs on in-memory SQLite.
    # CI is where Postgres gets exercised: these job-level variables win over
    # both `.env` (Dotenv is immutable) and phpunit.xml (its <env> entries never
    # overwrite an existing variable).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fleche_testing
          POSTGRES_USER: fleche
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # Over TCP: during its first-boot init the image runs a socket-only
        # temporary server, which a plain pg_isready reports as ready.
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U fleche -d fleche_testing"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: fleche_testing
      DB_USERNAME: fleche
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      # Yarn 4 comes through Corepack, pinned by `packageManager` in
      # package.json; enabled before setup-node, whose cache shells out to it.
      - name: Enable Corepack
        run: npm install -g corepack && corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn

      # Also builds the front end, which generates the Wayfinder routes the
      # type check needs.
      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
