# Plain HTTP on purpose: TLS belongs to the reverse proxy in front.
server {
    listen 80;
    server_name _;
    root /var/www/public;

    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        # After the include: recent Debian fastcgi_params set HTTP_HOST to
        # $host, which drops the port, and the last value wins. Without this an
        # instance published on :8099 redirects everybody to :80.
        fastcgi_param HTTP_HOST $http_host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
